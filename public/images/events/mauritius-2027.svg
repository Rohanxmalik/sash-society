<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4c5c"/>
      <stop offset="100%" style="stop-color:#1b6f82"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0b400"/>
      <stop offset="50%" style="stop-color:#ffcd05"/>
      <stop offset="100%" style="stop-color:#e0b400"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="650" cy="150" r="200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="150" cy="450" r="250" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Gold accent line -->
  <rect x="300" y="180" width="200" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- Conference number -->
  <text x="400" y="160" font-family="sans-serif" font-size="18" font-weight="600" fill="rgba(255,205,5,0.8)" text-anchor="middle" letter-spacing="4">4TH INTERNATIONAL CONFERENCE</text>

  <!-- SASS -->
  <text x="400" y="250" font-family="sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle" letter-spacing="6">SASS</text>

  <!-- Year -->
  <text x="400" y="310" font-family="sans-serif" font-size="48" font-weight="800" fill="url(#gold)" text-anchor="middle">2027</text>

  <!-- Location -->
  <text x="400" y="360" font-family="sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="6">MAURITIUS</text>

  <!-- Date -->
  <text x="400" y="400" font-family="sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">January 29 – February 2, 2027</text>

  <!-- Decorative bottom line -->
  <rect x="350" y="430" width="100" height="2" rx="1" fill="url(#gold)" opacity="0.5"/>

  <!-- Theme text -->
  <text x="400" y="470" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-style="italic">"Artificial Intelligence and Society: Interdisciplinary Perspectives on</text>
  <text x="400" y="490" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-style="italic">Human Development, Governance, Innovation and Sustainability"</text>
</svg>
