# Encrypted database dump, kept for 30 days as a workflow artifact. Needs
# repository secrets BACKUP_DATABASE_URL and BACKUP_PASSPHRASE. Restoring is
# covered in docs/GO-LIVE.md. Scheduled workflows only run from the default branch.
name: Nightly backup

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 India time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Must not be older than the Neon server, or pg_dump refuses to run.
      - name: Install the Postgres 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                --passphrase "$BACKUP_PASSPHRASE" --output sass-backup.dump.gpg

      - name: Keep the backup
        uses: actions/upload-artifact@v4
        with:
          name: sass-backup-${{ github.run_number }}
          path: sass-backup.dump.gpg
          retention-days: 30
          if-no-files-found: error
